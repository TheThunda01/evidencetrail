<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1001px" height="831px" viewBox="0 0 1001 831" id="ge-svg-a6boLhIl1O0wGAUvtqhr"><style type="text/css">@supports (color: light-dark(#000, #fff)) { #ge-svg-a6boLhIl1O0wGAUvtqhr { --ge-adaptive-fg: light-dark(#000000, var(--ge-light-color, #ffffff)); } }</style><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="20" y="20" width="940" height="55" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#153c4a" font-family="Arial" font-weight="bold" text-anchor="start" font-size="24px" style="fill: light-dark(rgb(21, 60, 74), rgb(165, 198, 210));"><text x="32" y="60">Reviewer agreement starts with pairing coverage</text></g></g></g><g data-cell-id="a"><g transform="translate(0.5,0.5)"><rect x="30" y="110" width="250" height="75" rx="11.25" ry="11.25" fill="#eef4f8" stroke="#88a8b7" pointer-events="all" style="fill: light-dark(rgb(238, 244, 248), rgb(24, 29, 32)); stroke: light-dark(rgb(136, 168, 183), rgb(76, 103, 116));"/></g><g><g fill="#183c4d" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(24, 60, 77), rgb(166, 197, 212));"><text x="155" y="145">Reviewer A</text><text x="155" y="164">Preserve submitted values</text></g></g></g><g data-cell-id="b"><g transform="translate(0.5,0.5)"><rect x="700" y="110" width="250" height="75" rx="11.25" ry="11.25" fill="#eef4f8" stroke="#88a8b7" pointer-events="all" style="fill: light-dark(rgb(238, 244, 248), rgb(24, 29, 32)); stroke: light-dark(rgb(136, 168, 183), rgb(76, 103, 116));"/></g><g><g fill="#183c4d" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(24, 60, 77), rgb(166, 197, 212));"><text x="825" y="145">Reviewer B</text><text x="825" y="164">Preserve submitted values</text></g></g></g><g data-cell-id="keys"><g transform="translate(0.5,0.5)"><rect x="365" y="100" width="250" height="95" rx="14.25" ry="14.25" fill="#e0f0ec" stroke="#528b79" pointer-events="all" style="fill: light-dark(rgb(224, 240, 236), rgb(23, 37, 34)); stroke: light-dark(rgb(82, 139, 121), rgb(92, 141, 126));"/></g><g><g fill="#173e32" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(23, 62, 50), rgb(166, 199, 189));"><text x="490" y="145">Pair by report_id + field</text><text x="490" y="164">One nonblank key per side</text></g></g></g><g data-cell-id="blocked"><g transform="translate(0.5,0.5)"><rect x="30" y="270" width="250" height="110" rx="16.5" ry="16.5" fill="#fff2d9" stroke="#b58b42" pointer-events="all" style="fill: light-dark(rgb(255, 242, 217), rgb(38, 27, 5)); stroke: light-dark(rgb(181, 139, 66), rgb(148, 111, 49));"/></g><g><g fill="#614618" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(97, 70, 24), rgb(196, 173, 133));"><text x="155" y="303.5">Missing or duplicate key</text><text x="155" y="322.5">Block ambiguous pairing</text><text x="155" y="341.5">Keep rows in coverage</text><text x="155" y="360.5">denominator</text></g></g></g><g data-cell-id="matched"><g transform="translate(0.5,0.5)"><rect x="365" y="270" width="250" height="110" rx="16.5" ry="16.5" fill="#e0f0ec" stroke="#528b79" pointer-events="all" style="fill: light-dark(rgb(224, 240, 236), rgb(23, 37, 34)); stroke: light-dark(rgb(82, 139, 121), rgb(92, 141, 126));"/></g><g><g fill="#173e32" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(23, 62, 50), rgb(166, 199, 189));"><text x="490" y="303.5">Comparable pairs</text><text x="490" y="322.5">Demo: 19 / 20 rows on each</text><text x="490" y="341.5">side</text><text x="490" y="360.5">95% pairing coverage</text></g></g></g><g data-cell-id="unmatched"><g transform="translate(0.5,0.5)"><rect x="700" y="270" width="250" height="110" rx="16.5" ry="16.5" fill="#fff2d9" stroke="#b58b42" pointer-events="all" style="fill: light-dark(rgb(255, 242, 217), rgb(38, 27, 5)); stroke: light-dark(rgb(181, 139, 66), rgb(148, 111, 49));"/></g><g><g fill="#614618" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(97, 70, 24), rgb(196, 173, 133));"><text x="825" y="303.5">Valid key on only one side</text><text x="825" y="322.5">Keep unmatched rows visible</text><text x="825" y="341.5">Keep rows in coverage</text><text x="825" y="360.5">denominator</text></g></g></g><g data-cell-id="answer"><g transform="translate(0.5,0.5)"><rect x="30" y="480" width="285" height="125" rx="18.75" ry="18.75" fill="#eef4f8" stroke="#88a8b7" pointer-events="all" style="fill: light-dark(rgb(238, 244, 248), rgb(24, 29, 32)); stroke: light-dark(rgb(136, 168, 183), rgb(76, 103, 116));"/></g><g><g fill="#183c4d" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(24, 60, 77), rgb(166, 197, 212));"><text x="172.5" y="511.5">Answer + evidence status</text><text x="172.5" y="530.5">Demo: 17 exact matches, 2</text><text x="172.5" y="549.5">differences</text><text x="172.5" y="568.5">Nonblank rates have their own</text><text x="172.5" y="587.5">denominators</text></g></g></g><g data-cell-id="locator"><g transform="translate(0.5,0.5)"><rect x="350" y="480" width="280" height="125" rx="18.75" ry="18.75" fill="#eef4f8" stroke="#88a8b7" pointer-events="all" style="fill: light-dark(rgb(238, 244, 248), rgb(24, 29, 32)); stroke: light-dark(rgb(136, 168, 183), rgb(76, 103, 116));"/></g><g><g fill="#183c4d" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(24, 60, 77), rgb(166, 197, 212));"><text x="490" y="521">Source locations</text><text x="490" y="540">Demo: 2 matched pairs differ</text><text x="490" y="559">Reported separately from answer</text><text x="490" y="578">agreement</text></g></g></g><g data-cell-id="decision"><g transform="translate(0.5,0.5)"><rect x="665" y="480" width="285" height="125" rx="18.75" ry="18.75" fill="#fff2d9" stroke="#b58b42" pointer-events="all" style="fill: light-dark(rgb(255, 242, 217), rgb(38, 27, 5)); stroke: light-dark(rgb(181, 139, 66), rgb(148, 111, 49));"/></g><g><g fill="#614618" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(97, 70, 24), rgb(196, 173, 133));"><text x="807.5" y="521">Researcher decision</text><text x="807.5" y="540">Choose, enter, or defer; give</text><text x="807.5" y="559">reason</text><text x="807.5" y="578">Does not verify the source</text></g></g></g><g data-cell-id="notes"><g><rect x="35" y="680" width="910" height="110" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#425b65" font-family="Arial" text-anchor="start" font-size="14px" style="fill: light-dark(rgb(66, 91, 101), rgb(146, 167, 176));"><text x="47" y="710">Synthetic demo counts illustrate the implementation, not reviewer reliability or scientific accuracy.</text><text x="47" y="727">Blank, one-sided blank, and nonblank pairs remain distinct. An empty rate denominator is undefined.</text><text x="47" y="744">Saving a decision again replaces that pair’s current decision; export before leaving the session.</text></g></g></g><g data-cell-id="edge0"><g transform="translate(0.5,0.5)"><path d="M 280 147.5 L 356.88 147.5" fill="none" stroke="#62808b" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(98, 128, 139), rgb(111, 137, 146));"/><path d="M 363.88 147.5 L 356.88 151 L 356.88 144 Z" fill="#62808b" stroke="#62808b" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(98, 128, 139), rgb(111, 137, 146)); stroke: light-dark(rgb(98, 128, 139), rgb(111, 137, 146));"/></g></g><g data-cell-id="edge1"><g transform="translate(0.5,0.5)"><path d="M 700 147.5 L 623.12 147.5" fill="none" stroke="#62808b" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(98, 128, 139), rgb(111, 137, 146));"/><path d="M 616.12 147.5 L 62